{% extends "base.html" %}
{% block title %}Login - GymTracker{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card p-4">
<h2 class="h4 mb-3">Login</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
  <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" value="1" id="remember"><label class="form-check-label" for="remember">Ingat saya</label></div>
  <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 mb-0 text-secondary">Belum punya akun? <a href="{{ url_for('web.register') }}">Registrasi Member</a></p>
</div></div></div>
{% endblock %}
