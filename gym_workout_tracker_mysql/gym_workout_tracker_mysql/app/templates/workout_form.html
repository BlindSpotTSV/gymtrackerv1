{% extends "base.html" %}
{% block title %}Log Workout{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Catat Workout</h1>
<form method="post" class="card p-4">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3 mb-3">
  <div class="col-md-7"><label class="form-label">Nama Workout</label><input class="form-control" name="name" placeholder="Push Day" required></div>
  <div class="col-md-5"><label class="form-label">Gunakan Workout Plan (opsional)</label><select class="form-select" name="plan_id"><option value="">Workout mandiri</option>{% for p in plans %}<option value="{{ p.id }}">{{ p.title }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label">Catatan</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
</div>
<h2 class="h5">Detail set</h2>
<p class="text-secondary small">Isi satu baris untuk setiap set. Baris kosong akan diabaikan.</p>
<div class="table-responsive"><table class="table">
<thead><tr><th>Exercise</th><th>Set ke-</th><th>Reps</th><th>Weight (kg)</th><th>Warm-up</th></tr></thead>
<tbody>
{% for row in range(1, 7) %}
<tr>
<td><select class="form-select" name="exercise_id"><option value="">Pilih exercise</option>{% for e in exercises %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}</select></td>
<td><input class="form-control" type="number" min="1" name="set_number" value="{{ row }}"></td>
<td><input class="form-control" type="number" min="1" name="reps" placeholder="10"></td>
<td><input class="form-control" type="number" min="0" step="0.25" name="weight_kg" value="0"></td>
<td class="text-center"><input class="form-check-input" type="checkbox" name="is_warmup" value="{{ row-1 }}"></td>
</tr>
{% endfor %}
</tbody></table></div>
<button class="btn btn-primary align-self-start">Simpan Workout</button>
</form>
{% endblock %}
