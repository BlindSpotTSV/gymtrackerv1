{% extends "base.html" %}
{% block title %}Clients{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Daftar Klien</h1><div class="card p-3"><div class="table-responsive"><table class="table align-middle mb-0">
<thead><tr><th>Nama</th><th>Email</th><th>Progres</th></tr></thead>
<tbody>{% for c in clients %}<tr><td>{{ c.full_name }}</td><td>{{ c.email }}</td><td><a href="{{ url_for('web.coach_progress', member_id=c.id) }}">Lihat progres</a></td></tr>{% else %}<tr><td colspan="3">Belum ada klien. Terima permintaan dari Member.</td></tr>{% endfor %}</tbody>
</table></div></div>
{% endblock %}
