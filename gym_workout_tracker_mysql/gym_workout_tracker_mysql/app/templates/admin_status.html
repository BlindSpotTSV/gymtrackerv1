{% extends "base.html" %}
{% block title %}System Status{% endblock %}
{% block content %}
<h1 class="h3 mb-3">System Status</h1>
<div class="row g-3">{% for key, value in status.items() %}<div class="col-6 col-md-3"><div class="card p-3"><div class="text-secondary">{{ key|replace('_',' ')|title }}</div><div class="h2">{{ value }}</div></div></div>{% endfor %}</div>
{% endblock %}
