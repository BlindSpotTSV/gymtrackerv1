{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Kelola Pengguna</h1>
<div class="card p-3 mb-3"><h2 class="h5">Buat User / Coach</h2>
<form method="post" class="row g-2">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-3"><input class="form-control" name="full_name" placeholder="Nama lengkap" required></div>
<div class="col-md-3"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
<div class="col-md-3"><input class="form-control" type="password" name="password" placeholder="Password min. 10 karakter" minlength="10" required></div>
<div class="col-md-2"><select class="form-select" name="role"><option value="member">Member</option><option value="coach">Coach</option><option value="admin">Admin</option></select></div>
<div class="col-md-1"><button class="btn btn-primary">Add</button></div>
</form></div>
<div class="card p-3"><div class="table-responsive"><table class="table align-middle mb-0">
<thead><tr><th>ID</th><th>Nama</th><th>Email</th><th>Role</th><th>Pengaturan</th></tr></thead>
<tbody>{% for u in users %}
<tr>
<td>{{ u.id }}</td><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td>
<td>
<form method="post" action="{{ url_for('web.admin_update_user', user_id=u.id) }}" class="d-flex flex-wrap gap-2">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<select class="form-select form-select-sm" name="is_active" style="max-width:120px">
<option value="1" {% if u.is_active %}selected{% endif %}>Aktif</option>
<option value="0" {% if not u.is_active %}selected{% endif %}>Nonaktif</option>
</select>
{% if u.role == 'member' %}
<select class="form-select form-select-sm" name="coach_id" style="max-width:180px">
<option value="">Tanpa Coach</option>
{% for c in coaches %}<option value="{{ c.id }}" {% if u.coach_id == c.id %}selected{% endif %}>{{ c.full_name }}</option>{% endfor %}
</select>
{% endif %}
<button class="btn btn-sm btn-outline-primary">Simpan</button>
</form>
</td>
</tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
